<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X3 ÉLITE — SISTEMA OPERATIVO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --hi: #00d4ff; --bg: #000812; --tx: #c8e8ff; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--tx); font-family: 'Rajdhani', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Barra de Indicadores */
        #top-bar { 
            display: flex; justify-content: space-around; padding: 10px; 
            background: rgba(0,212,255,0.1); border-bottom: 1px solid var(--hi);
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
            flex-shrink: 0;
        }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }
        .msg { padding: 12px; border-radius: 8px; max-width: 85%; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .user { align-self: flex-end; background: linear-gradient(45deg, #7c3aed, #00d4ff); color: white; }
        .x3 { align-self: flex-start; background: rgba(0,212,255,0.05); border-left: 3px solid var(--hi); }
        
        #input-area { position: fixed; bottom: 0; width: 100%; padding: 12px 16px; background: var(--bg); border-top: 1px solid rgba(0,212,255,0.3); display: flex; gap: 8px; }
        input { flex: 1; background: #0a1a28; border: 1px solid var(--hi); color: white; padding: 12px; border-radius: 5px; outline: none; font-size: 16px; font-family: 'Rajdhani', sans-serif; }
        input::placeholder { color: rgba(200,232,255,0.4); }
        button { background: var(--hi); border: none; padding: 10px 18px; border-radius: 5px; font-weight: bold; cursor: pointer; color: #000; font-family: 'Orbitron', monospace; font-size: 0.8rem; }
        button:active { opacity: 0.8; }
        #mic-btn { background: rgba(0,212,255,0.15); border: 1px solid var(--hi); color: var(--hi); padding: 10px 14px; border-radius: 5px; font-size: 1.2rem; cursor: pointer; }
        #mic-btn.active { background: rgba(255,50,50,0.3); border-color: #ff3232; color: #ff3232; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

        /* Logo */
        #logo { text-align: center; padding: 8px; font-family: 'Orbitron', monospace; font-size: 1.1rem; color: var(--hi); letter-spacing: 4px; flex-shrink: 0; border-bottom: 1px solid rgba(0,212,255,0.2); }
    </style>
</head>
<body>

    <div id="logo">⬡ X3 ÉLITE</div>

    <div id="top-bar">
        <span>UF: <b id="uf">...</b></span>
        <span>USD: <b id="usd">...</b></span>
        <span>UTM: <b id="utm">...</b></span>
        <span>● ONLINE</span>
    </div>

    <div id="chat-container">
        <div class="msg x3">Sistemas en línea. Motor Gemini 2.0 Flash operativo. Soy X3 ÉLITE — tu superinteligencia personal. ¿En qué trabajamos hoy?</div>
    </div>

    <div id="input-area">
        <button id="mic-btn" onclick="toggleMic()" title="Micrófono">🎙</button>
        <input type="text" id="userInput" placeholder="Escribe a X3..." onkeydown="if(event.key==='Enter') enviar()">
        <button onclick="enviar()">ENVIAR</button>
    </div>

    <script>
        let historial = [];
        let recognition = null;
        let micActive = false;

        // Datos en tiempo real
        async function getStats() {
            try {
                const r = await fetch('https://mindicador.cl/api');
                const d = await r.json();
                document.getElementById('uf').innerText = "$" + d.uf.valor.toLocaleString('es-CL');
                document.getElementById('usd').innerText = "$" + d.dolar.valor.toLocaleString('es-CL');
                document.getElementById('utm').innerText = "$" + d.utm.valor.toLocaleString('es-CL');
            } catch(e) { 
                document.getElementById('uf').innerText = "N/D";
                document.getElementById('usd').innerText = "N/D";
                document.getElementById('utm').innerText = "N/D";
            }
        }
        getStats();
        setInterval(getStats, 3600000); // Actualiza cada hora

        // Micrófono
        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            if (micActive) {
                if (recognition) recognition.stop();
                micActive = false;
                btn.classList.remove('active');
                btn.innerText = '🎙';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome.');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'es-CL';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                micActive = true;
                btn.classList.add('active');
                btn.innerText = '⏹';
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                document.getElementById('userInput').value = texto;
                micActive = false;
                btn.classList.remove('active');
                btn.innerText = '🎙';
                enviar();
            };

            recognition.onerror = (e) => {
                micActive = false;
                btn.classList.remove('active');
                btn.innerText = '🎙';
                if (e.error === 'not-allowed') alert('Activa el micrófono en la configuración del navegador.');
            };

            recognition.onend = () => {
                micActive = false;
                btn.classList.remove('active');
                btn.innerText = '🎙';
            };

            recognition.start();
        }

        async function enviar() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';

            const x3Div = addMsg('▋', 'x3');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, history: historial })
                });

                if (!response.ok) throw new Error('Error ' + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    fullResponse += chunk;
                    x3Div.innerText = fullResponse;
                    document.getElementById('chat-container').scrollTop = 99999;
                }
                
                historial.push({ role: 'user', parts: [{ text: text }] });
                historial.push({ role: 'model', parts: [{ text: fullResponse }] });

                // TTS para respuestas cortas
                if (fullResponse.length < 300 && window.speechSynthesis) {
                    const u = new SpeechSynthesisUtterance(fullResponse);
                    u.lang = 'es-CL';
                    u.rate = 1.1;
                    window.speechSynthesis.speak(u);
                }

            } catch (err) {
                x3Div.innerText = "⚠ Error de conexión. Verifica tu API key en Vercel.";
            }
        }

        function addMsg(t, cls) {
            const d = document.createElement('div');
            d.className = 'msg ' + cls;
            d.innerText = t;
            document.getElementById('chat-container').appendChild(d);
            document.getElementById('chat-container').scrollTop = 99999;
            return d;
        }
    </script>
</body>
</html>
