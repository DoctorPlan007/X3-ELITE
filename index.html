<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>X3 ÉLITE — SISTEMA OPERATIVO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hi:#00d4ff;--hi2:#7c3aed;--bg:#000812;--tx:#c8e8ff;--green:#00ffaa;--gold:#ffd700; }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
        body{background:var(--bg);color:var(--tx);font-family:'Rajdhani',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.04)1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.04)1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
        #header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,8,18,.97);border-bottom:1px solid var(--hi);backdrop-filter:blur(20px);flex-shrink:0;gap:8px}
        .h-left{display:flex;align-items:center;gap:8px}
        .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--hi);box-shadow:0 0 8px var(--hi),0 0 16px var(--hi);animation:pulse 2s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
        .logo{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900;background:linear-gradient(135deg,var(--hi),var(--hi2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .badge{font-family:'Share Tech Mono',monospace;font-size:.55rem;padding:2px 7px;border:1px solid var(--hi);border-radius:4px;color:var(--hi);background:rgba(0,212,255,.08);text-shadow:0 0 8px var(--hi);letter-spacing:.15em}
        .h-stats{display:flex;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:.72rem;flex:1;justify-content:center}
        .stat-lbl{color:rgba(0,212,255,.5);font-size:.62rem;letter-spacing:.1em}
        .stat-val{color:var(--hi);font-weight:700;text-shadow:0 0 8px var(--hi)}
        .stat-online{color:var(--green);font-weight:700;text-shadow:0 0 8px var(--green)}
        .stat-sep{color:rgba(0,212,255,.2)}
        .h-right{display:flex;align-items:center;gap:6px}
        .icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(0,212,255,.2);background:rgba(255,255,255,.04);color:rgba(200,232,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:.9rem}
        .icon-btn:hover,.icon-btn.active{border-color:var(--hi);color:var(--hi);box-shadow:0 0 12px rgba(0,212,255,.4)}
        .icon-btn.voice-on{border-color:var(--green);color:var(--green);background:rgba(0,255,170,.08)}
        .icon-btn.save-on{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
        .user-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--hi),var(--hi2));display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;color:#000}
        #save-banner{display:none;background:rgba(255,215,0,.08);border-bottom:1px solid rgba(255,215,0,.3);color:var(--gold);font-family:'Share Tech Mono',monospace;font-size:.65rem;text-align:center;padding:4px;letter-spacing:.1em;flex-shrink:0;z-index:9;position:relative}
        #chat-flow{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;position:relative;z-index:1}
        .msg{display:flex;gap:10px;animation:fadeUp .3s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .msg.user{flex-direction:row-reverse}
        .msg-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--hi),var(--hi2));display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;color:#000;margin-top:2px}
        .bubble{max-width:82%;padding:12px 15px;border-radius:12px;font-size:.95rem;line-height:1.55}
        .bubble.x3{background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);border-bottom-left-radius:2px}
        .bubble.user{background:linear-gradient(135deg,var(--hi2),var(--hi));color:#fff;border-bottom-right-radius:2px}
        .bubble img.msg-img{max-width:200px;border-radius:8px;border:1px solid rgba(0,212,255,.3);display:block;margin-bottom:8px}
        .msg-time{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:rgba(200,232,255,.3);display:block;margin-top:5px}
        .dots{display:flex;gap:5px;align-items:center;padding:4px 0}
        .dots span{width:7px;height:7px;border-radius:50%;background:var(--hi);animation:bounce 1.4s ease-in-out infinite}
        .dots span:nth-child(2){animation-delay:.2s;background:var(--hi2)}
        .dots span:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1.1);opacity:1}}
        #footer{position:relative;z-index:10;padding:10px 12px 12px;background:rgba(0,8,18,.95);border-top:1px solid rgba(0,212,255,.2);flex-shrink:0}
        #img-preview{display:none;align-items:center;gap:8px;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);border-radius:10px;padding:6px 10px;margin-bottom:6px}
        #img-preview img{width:48px;height:48px;object-fit:cover;border-radius:6px}
        #img-preview span{flex:1;font-size:.72rem;color:var(--hi);font-family:'Share Tech Mono',monospace}
        #img-preview button{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:1rem}
        .input-bar{display:flex;align-items:flex-end;gap:8px;background:rgba(13,20,40,.8);border:1px solid rgba(0,212,255,.15);border-radius:16px;padding:8px;transition:border-color .2s,box-shadow .2s}
        .input-bar:focus-within{border-color:var(--hi);box-shadow:0 0 0 1px rgba(0,212,255,.2),0 0 20px rgba(0,212,255,.25)}
        .cam-btn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(0,212,255,.3);background:rgba(0,212,255,.06);color:var(--hi);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;font-size:1.1rem}
        .cam-btn:hover{background:rgba(0,212,255,.15);box-shadow:0 0 16px rgba(0,212,255,.4)}
        .mic-btn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(0,212,255,.15);background:rgba(255,255,255,.04);color:rgba(200,232,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;font-size:1.1rem}
        .mic-btn:hover{border-color:var(--hi);color:var(--hi)}
        .mic-btn.listening{border-color:#ff4444!important;color:#ff4444!important;background:rgba(255,68,68,.1)!important;animation:pulse .8s ease-in-out infinite}
        textarea#inp{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Rajdhani',sans-serif;font-size:.95rem;line-height:1.5;resize:none;max-height:120px;overflow-y:auto;padding:4px 0}
        textarea#inp::placeholder{color:rgba(200,232,255,.3)}
        .send-btn{width:38px;height:38px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--hi),var(--hi2));color:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;font-size:1.1rem}
        .send-btn:hover:not(:disabled){transform:scale(1.05);box-shadow:0 0 20px rgba(0,212,255,.5)}
        .send-btn:disabled{opacity:.4;cursor:not-allowed}
        .footer-hint{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:rgba(200,232,255,.25);text-align:center;margin-top:6px;letter-spacing:.05em}
        @media(max-width:480px){.h-stats{font-size:.65rem;gap:4px}.stat-lbl{display:none}}
        @supports(padding-bottom:env(safe-area-inset-bottom)){#footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
    </style>
</head>
<body>
<div id="header">
    <div class="h-left">
        <div class="pulse-dot"></div>
        <span class="logo">X3</span>
        <span class="badge">ÉLITE</span>
    </div>
    <div class="h-stats">
        <div><span class="stat-lbl">UF </span><span class="stat-val" id="val-uf">---</span></div>
        <span class="stat-sep">|</span>
        <div><span class="stat-lbl">USD </span><span class="stat-val" id="val-usd">---</span></div>
        <span class="stat-sep">|</span>
        <div><span class="stat-lbl">X3 </span><span class="stat-online">ONLINE</span></div>
    </div>
    <div class="h-right">
        <button class="icon-btn" id="btn-save" title="Modo Ahorro" onclick="toggleSave()">⚡</button>
        <button class="icon-btn voice-on" id="btn-voice" title="Voz ON/OFF" onclick="toggleVoice()">🔊</button>
        <button class="icon-btn" title="Borrar memoria" onclick="borrarMemoria()">🗑️</button>
        <div class="user-av">A</div>
    </div>
</div>
<div id="save-banner">⚡ MODO AHORRO ACTIVO — Historial limitado a 6 mensajes</div>
<div id="chat-flow"></div>
<div id="footer">
    <div id="img-preview">
        <img id="img-thumb" src="" alt="">
        <span>📷 Imagen lista para análisis</span>
        <button onclick="clearImg()">✕</button>
    </div>
    <div class="input-bar">
        <input type="file" id="fileInp" accept="image/*" style="display:none" onchange="handleImg(this)">
        <button class="cam-btn" onclick="document.getElementById('fileInp').click()" title="Enviar imagen">📷</button>
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Hablar">🎙️</button>
        <textarea id="inp" rows="1" placeholder="Comando a X3..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"></textarea>
        <button class="send-btn" onclick="enviar()" title="Enviar">🚀</button>
    </div>
    <p class="footer-hint" id="footer-hint">X3 ÉLITE · LISTO · FULL · Alexander</p>
</div>
<script>
let historial=JSON.parse(localStorage.getItem('x3_v7'))||[];
let tempImg=null,tempMime=null,voiceEnabled=true,dataSaveMode=false,isListening=false,recognition=null;
historial.forEach(m=>addMsg(m.parts[0].text,m.role==='user'?'user':'x3'));
if(historial.length===0)addMsg('SISTEMAS EN LÍNEA. Soy X3 — tu superinteligencia personal. Motor IA operativo. Niveles 1-4 activos. Puedes escribir, hablar o enviar una imagen.','x3');
async function fetchStats(){try{const r=await fetch('https://mindicador.cl/api');const d=await r.json();document.getElementById('val-uf').textContent='$'+d.uf.valor.toLocaleString('es-CL');document.getElementById('val-usd').textContent='$'+d.dolar.valor.toLocaleString('es-CL')}catch(e){}}
fetchStats();setInterval(fetchStats,5*60*1000);
function handleImg(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=(e)=>{tempImg=e.target.result.split(',')[1];tempMime=f.type;document.getElementById('img-thumb').src=e.target.result;document.getElementById('img-preview').style.display='flex'};r.readAsDataURL(f);input.value=''}
function clearImg(){tempImg=null;tempMime=null;document.getElementById('img-preview').style.display='none';document.getElementById('img-thumb').src=''}
function hablar(texto){if(!voiceEnabled||!window.speechSynthesis)return;window.speechSynthesis.cancel();const clean=texto.replace(/```[\s\S]*?```/g,'código generado').replace(/[#*_`]/g,'').slice(0,400);const u=new SpeechSynthesisUtterance(clean);u.lang='es-CL';u.rate=1.05;u.pitch=0.95;u.onend=()=>updateHint('LISTO');window.speechSynthesis.speak(u)}
function toggleVoice(){voiceEnabled=!voiceEnabled;const btn=document.getElementById('btn-voice');if(voiceEnabled){btn.classList.add('voice-on')}else{btn.classList.remove('voice-on');window.speechSynthesis?.cancel()}}
function toggleSave(){dataSaveMode=!dataSaveMode;const btn=document.getElementById('btn-save');const banner=document.getElementById('save-banner');if(dataSaveMode){btn.classList.add('save-on');banner.style.display='block'}else{btn.classList.remove('save-on');banner.style.display='none'}}
function toggleMic(){if(isListening){recognition?.stop();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Usa Chrome para reconocimiento de voz.');return}recognition=new SR();recognition.lang='es-CL';recognition.continuous=false;recognition.interimResults=false;recognition.onstart=()=>{isListening=true;document.getElementById('mic-btn').classList.add('listening');updateHint('🔴 ESCUCHANDO')};recognition.onresult=(e)=>{const t=e.results[0][0].transcript;document.getElementById('inp').value=t;isListening=false;document.getElementById('mic-btn').classList.remove('listening');setTimeout(()=>{if(t.trim())enviar()},300)};recognition.onerror=()=>{isListening=false;document.getElementById('mic-btn').classList.remove('listening');updateHint('LISTO')};recognition.onend=()=>{isListening=false;document.getElementById('mic-btn').classList.remove('listening')};recognition.start()}
async function enviar(){const inp=document.getElementById('inp');const txt=inp.value.trim();if(!txt&&!tempImg)return;addMsg(txt||'Analizando imagen...','user',tempImg?document.getElementById('img-thumb').src:null);inp.value='';const imgB64=tempImg,imgMime=tempMime;clearImg();const aiWrap=addMsg('','x3');aiWrap.querySelector('.bubble').innerHTML='<div class="dots"><span></span><span></span><span></span></div>';const histLimit=dataSaveMode?historial.slice(-6):historial.slice(-20);try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:txt||'Analiza y describe esta imagen en detalle',history:histLimit,image:imgB64,mimeType:imgMime})});if(!res.ok)throw new Error('Error '+res.status);const reader=res.body.getReader();const decoder=new TextDecoder();let full='';const bubble=aiWrap.querySelector('.bubble');bubble.innerHTML='';while(true){const{done,value}=await reader.read();if(done)break;full+=decoder.decode(value,{stream:true});bubble.innerHTML=formatText(full);document.getElementById('chat-flow').scrollTop=99999}historial.push({role:'user',parts:[{text:txt||'Imagen enviada'}]});historial.push({role:'model',parts:[{text:full}]});localStorage.setItem('x3_v7',JSON.stringify(historial.slice(-20)));hablar(full);updateHint('LISTO')}catch(err){aiWrap.querySelector('.bubble').innerHTML='⚠️ Error: '+err.message;updateHint('ERROR')}}
function addMsg(texto,cls,imgSrc){const wrap=document.createElement('div');wrap.className='msg '+(cls==='user'?'user':'');const now=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});const imgHtml=imgSrc?`<img class="msg-img" src="${imgSrc}" alt="">`:'';if(cls!=='user'){wrap.innerHTML=`<div class="msg-av">X3</div><div class="bubble x3">${imgHtml}${formatText(texto)}<span class="msg-time">${now}</span></div>`}else{wrap.innerHTML=`<div class="bubble user">${imgHtml}${formatText(texto)}<span class="msg-time">${now}</span></div>`}document.getElementById('chat-flow').appendChild(wrap);document.getElementById('chat-flow').scrollTop=99999;return wrap}
function formatText(t){return t.replace(/```([\s\S]*?)```/g,'<pre style="background:rgba(0,0,0,.4);padding:10px;border-radius:8px;overflow-x:auto;font-size:.8rem;border-left:3px solid var(--hi)">$1</pre>').replace(/`([^`]+)`/g,'<code style="background:rgba(0,212,255,.1);padding:1px 5px;border-radius:3px;font-family:monospace">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function updateHint(status){document.getElementById('footer-hint').textContent=`X3 ÉLITE · ${status} · ${dataSaveMode?'⚡ AHORRO':'FULL'} · Alexander`}
function borrarMemoria(){if(confirm('¿Borrar toda la memoria de X3?')){localStorage.removeItem('x3_v7');location.reload()}}
</script>
</body>
</html>
